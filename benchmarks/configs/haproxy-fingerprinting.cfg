global
    tune.ssl.capture-buffer-size 256
    log stdout format raw local0 info

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    log global

frontend https
    bind *:443 ssl crt /etc/haproxy/certs/server.pem
    filter spoe engine fingerprinting config /etc/haproxy/spoe-fingerprint.conf
    http-request set-var(txn.ja3n_hash) var(sess.spoe.fingerprinting.hash)
    http-request return status 200 content-type "text/plain" string "ok\n"

backend spoa-hub-backend
    mode spop
    server hub /var/run/spoe/hub.sock maxconn 1024
