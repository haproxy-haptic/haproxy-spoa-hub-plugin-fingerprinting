apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      containers:
        - name: haproxy
          image: HAPROXY_IMAGE_PLACEHOLDER
          imagePullPolicy: Never
          command: ["haproxy"]
          args: ["-f", "/usr/local/etc/haproxy/haproxy.cfg", "-db"]
          ports:
            - containerPort: 443
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
            - name: tls-certs
              mountPath: /etc/haproxy/certs
              readOnly: true
          resources:
            requests:
              cpu: "2"
              memory: "256Mi"
            limits:
              cpu: "4"
              memory: "512Mi"
      volumes:
        - name: haproxy-config
          configMap:
            name: haproxy-config
        - name: tls-certs
          secret:
            secretName: haproxy-tls
