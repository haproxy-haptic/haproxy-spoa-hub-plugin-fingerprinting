global
    log stdout format raw local0 info
    tune.ssl.capture-buffer-size 256

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend https-in
    bind *:8443 ssl crt /etc/haproxy/cert.pem
    http-request return status 200 content-type "text/plain" string "ok\n"
