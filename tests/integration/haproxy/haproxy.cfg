global
    log stdout format raw local0 info
    tune.ssl.capture-buffer-size 256

defaults
    mode http
    log global
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend https-in
    bind *:8443 ssl crt /etc/haproxy/cert.pem
    filter spoe engine fingerprinting config /etc/haproxy/spoe-fingerprint.conf

    http-request set-header X-Fingerprint-Hash %[var(sess.spoe.fingerprinting.hash)]
    http-request set-header X-Fingerprint-Raw  %[var(sess.spoe.fingerprinting.raw)]

    http-request return status 200 content-type "text/plain" lf-string "hash=%[var(sess.spoe.fingerprinting.hash)]\nraw=%[var(sess.spoe.fingerprinting.raw)]\n"

backend spoa-hub-backend
    mode tcp
    server hub /var/run/spoe/hub.sock maxconn 256
