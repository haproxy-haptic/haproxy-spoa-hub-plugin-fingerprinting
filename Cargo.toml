[package]
name = "fingerprinting-plugin"
version = "0.3.0"
edition = "2024"
rust-version = "1.86"
description = "TLS fingerprinting plugin for haproxy-spoa-hub (JA3/JA3N, JA4)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Requires plugin-api 0.6.0+ for the v2 vtable's set_metric_recorder.
# Plugin still loads on v0.5.x hubs — v2 vtable field is appended,
# old hubs read only what they know.
haproxy-spoa-hub-plugin-api = "0.7"
md-5 = "0.11"
sha2 = "0.11"
log = "0.4"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "ja3_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
