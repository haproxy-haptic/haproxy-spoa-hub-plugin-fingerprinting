[package]
name = "fingerprinting-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "TLS fingerprinting plugin for haproxy-spoa-hub (JA3/JA3N)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
haproxy-spoa-hub-plugin-api = { path = "../haproxy-spoa-hub/crates/plugin-api" }
abi_stable = "0.11"
md-5 = "0.10"
log = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "ja3_bench"
harness = false
